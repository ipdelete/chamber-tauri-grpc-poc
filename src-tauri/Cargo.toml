[package]
name = "chamber-tauri-host"
version = "0.1.0"
edition = "2024"
default-run = "chamber-tauri-host"

[dependencies]
getrandom = "0.4.3"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.6"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.18"
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
tonic-prost-build = "0.14.6"
