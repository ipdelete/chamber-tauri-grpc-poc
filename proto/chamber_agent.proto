syntax = "proto3";

package chamber.agent.v1;

service AgentRuntime {
  rpc Interact(stream HostMessage) returns (stream AgentEvent);
}

message AgentEvent {
  string session_id = 1;

  reserved 6; // was HostToolCall

  oneof payload {
    Started started = 2;
    TextDelta text_delta = 3;
    Completed completed = 4;
    RuntimeError error = 5;
    ApprovalRequest approval_request = 7;
    LensChanged lens_changed = 8;
  }
}

message HostMessage {
  string session_id = 1;

  reserved 3; // was HostToolResult

  oneof payload {
    UserPrompt prompt = 2;
    ApprovalDecision approval_decision = 4;
  }
}

message UserPrompt {
  string text = 1;
}

message ApprovalRequest {
  string tool_call_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
}

message ApprovalDecision {
  string tool_call_id = 1;

  oneof outcome {
    Approved approved = 2;
    Denied denied = 3;
  }
}

message Approved {}

message Denied {
  string reason = 1;
}

message LensChanged {
  string id = 1;
  string name = 2;
  string icon = 3;
  string html = 4;
}

message Started {}

message TextDelta {
  string text = 1;
}

message Completed {}

message RuntimeError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}
